version: 0.1
component: build
timeoutInSeconds: 300
shell: bash

steps:
  - type: Command
    name: "Debug Files"
    command: |
      echo "Current directory:"
      pwd
      echo "All files:"
      ls -R

  - type: Command
    name: "Package Application"
    command: |
      echo "Zipping project..."
      zip -r app.zip .

outputArtifacts:
  - name: app_bundle
    type: BINARY
    location: "app.zip"
